name: Build Minha Bateria APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MINHA_BATERIA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minha-bateria-release.jks"

      - name: Build signed release APK
        env:
          MINHA_BATERIA_KEYSTORE_PATH: ${{ runner.temp }}/minha-bateria-release.jks
          MINHA_BATERIA_KEYSTORE_PASSWORD: ${{ secrets.MINHA_BATERIA_KEYSTORE_PASSWORD }}
          MINHA_BATERIA_KEY_ALIAS: ${{ secrets.MINHA_BATERIA_KEY_ALIAS }}
          MINHA_BATERIA_KEY_PASSWORD: ${{ secrets.MINHA_BATERIA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Minha-Bateria-1.0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minha-Bateria-1.0.3
          path: Minha-Bateria-1.0.3.apk
