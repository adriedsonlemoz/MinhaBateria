name: Build e publicar Minha Bateria

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar keystore release
        env:
          KEYSTORE_BASE64: ${{ secrets.MINHA_BATERIA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minha-bateria-release.jks"

      - name: Compilar APK release assinado
        env:
          MINHA_BATERIA_KEYSTORE_PATH: ${{ runner.temp }}/minha-bateria-release.jks
          MINHA_BATERIA_KEYSTORE_PASSWORD: ${{ secrets.MINHA_BATERIA_KEYSTORE_PASSWORD }}
          MINHA_BATERIA_KEY_ALIAS: ${{ secrets.MINHA_BATERIA_KEY_ALIAS }}
          MINHA_BATERIA_KEY_PASSWORD: ${{ secrets.MINHA_BATERIA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Preparar APK de entrega
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Minha-Bateria-1.0.8.apk
          test -f release/Minha-Bateria-1.0.8.apk

      - name: Publicar somente o APK no GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.8"
          TITLE="Minha Bateria 1.0.8"
          APK="release/Minha-Bateria-1.0.8.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "APK release assinado para instalação direta. O workflow publica somente o APK como arquivo de entrega."
          fi
